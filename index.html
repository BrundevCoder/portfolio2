<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A place where you can check Bruno's Portfolio!">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_shape_up" />
    <link rel="stylesheet" href="style.css">
    <title>Bruno Portfolio</title>
</head>
<body>

    <header class="header">
        <p>Bruno</p>
    </header>

    <main class="main">
        <section class="intro">
            <p>Hello, I'm <br><span>Bruno</span>!</p>
            <div class="arrow-container">
                <span class="material-symbols-outlined" translate="no">arrow_shape_up</span>
            </div>
        </section>

        <section class="about">
            <div class="title-group">
                <p>About.</p>
            </div>
            <div class="about-flex">
                <img src="imgs/pfp.jpg" alt="Profile Picture of Bruno" draggable="false">
                <div class="about-text">
                    <p>Haii! I'm Bruno :D A guy from Portugal who loves software. It all started when I was little and tried creating games in <span class="hightlited">Roblox Studio</span>, since then, I've evolved to making websites and projects in Python. You can see some of them <a href="#projects">here</a></p>
                </div>
            </div>
        </section>

        <section class="projects-group" id="projects">

        </section>
    </main>
    
</body>
</html>
